# herdr configuration. Defaults: `herdr --default-config`.
# Linked from ~/.config/herdr/config.toml (nix/modules/editor.nix).
# Apply changes with `herdr server reload-config` or prefix+shift+r.

onboarding = false

# Everforest Medium, matching config/ghostty/config and config/zed/settings.json.
# Gruvbox is the closest built-in base; every token below overrides it.
# Panel backgrounds use "reset" so Ghostty's own background (and its
# transparency) shows through.
[theme]
auto_switch = true
dark_name = "gruvbox"
light_name = "gruvbox-light"

[theme.custom.dark]
panel_bg = "reset"
surface_dim = "#232a2e"
sidebar_bg = "#2d353b"
surface0 = "#343f44"
surface1 = "#3d484d"
active_row_bg = "#3d484d"
selection_bg = "#543a48"
overlay0 = "#7a8478"
overlay1 = "#859289"
subtext0 = "#9da9a0"
text = "#d3c6aa"
accent = "#a7c080"
green = "#a7c080"
teal = "#83c092"
blue = "#7fbbb3"
yellow = "#dbbc7f"
peach = "#e69875"
red = "#e67e80"
mauve = "#d699b6"

[theme.custom.light]
panel_bg = "reset"
surface_dim = "#efebd4"
sidebar_bg = "#f4f0d9"
surface0 = "#e6e2cc"
surface1 = "#e0dcc7"
active_row_bg = "#e0dcc7"
selection_bg = "#eaedc8"
overlay0 = "#a6b0a0"
overlay1 = "#939f91"
subtext0 = "#829181"
text = "#5c6a72"
accent = "#8da101"
green = "#8da101"
teal = "#35a77c"
blue = "#3a94c5"
yellow = "#dfa000"
peach = "#f57d26"
red = "#f85552"
mauve = "#df69ba"

[keys]
# Same pane movement as config/zellij/config.kdl. Other Alt chords are left
# alone because the shell and agents use them (Alt+. last arg, Alt+t/p in Claude).
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[ui]
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
status_indicators = "symbols"

[ui.toast]
# Desktop notification when an agent in another workspace finishes or needs input.
delivery = "system"
